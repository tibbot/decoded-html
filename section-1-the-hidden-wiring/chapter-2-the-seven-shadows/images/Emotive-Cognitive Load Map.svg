m="matrix(1 0 0 1 3163.3 1225)">Can I move forward?</text><text fill="#393939" font-family="Segoe UI Light,Segoe UI Light_MSFontService,sans-serif" font-weight="300" font-size="55" transform="matrix(1 0 0 1 3157 1291)">(Operational / Cognitive)</text><text fill="#393939" font-family="Segoe UI Light,Segoe UI Light_MSFontService,sans-serif" font-weight="300" font-size="83" transform="matrix(1 0 0 1 2326.39 743)">I know what to do</text><text fill="#393939" font-family="Segoe UI Light,Segoe UI Light_MSFontService,sans-serif" font-weight="300" font-size="83" transform="matrix(1 0 0 1 2946.28 743)">—</text><text fill="#393939" font-family="Segoe UI Light,Segoe UI Light_MSFontService,sans-serif" font-weight="300" font-size="83" transform="matrix(1 0 0 1 2275.97 842)">and I’m good doing it</text><text fill="#393939" font-family="Segoe UI Light,Segoe UI Light_MSFontService,sans-serif" font-weight="300" font-size="83" transform="matrix(1 0 0 1 2512.33 1610)">I understand</text><text fill="#393939" font-family="Segoe UI Light,Segoe UI Light_MSFontService,sans-serif" font-weight="300" font-size="83" transform="matrix(1 0 0 1 2946.26 1610)">—</text><text fill="#393939" font-family="Segoe UI Light,Segoe UI Light_MSFontService,sans-serif" font-weight="300" font-size="83" transform="matrix(1 0 0 1 2553.81 1709)">but I wouldn’t </text><text fill="#393939" font-family="Segoe UI Light,Segoe UI Light_MSFontService,sans-serif" font-weight="300" font-size="83" transform="matrix(1 0 0 1 2749.75 1808)">act on it</text><text fill="#393939" font-family="Segoe UI Light,Segoe UI Light_MSFontService,sans-serif" font-weight="300" font-size="83" transform="matrix(1 0 0 1 1316.56 693)">This sounds nice</text><text fill="#393939" font-family="Segoe UI Light,Segoe UI Light_MSFontService,sans-serif" font-weight="300" font-size="83" transform="matrix(1 0 0 1 1882.03 693)">—</text><text fill="#393939" font-family="Segoe UI Light,Segoe UI Light_MSFontService,sans-serif" font-weight="300" font-size="83" transform="matrix(1 0 0 1 1316.56 792)">but what am I </text><text fill="#393939" font-family="Segoe UI Light,Segoe UI Light_MSFontService,sans-serif" font-weight="300" font-size="83" transform="matrix(1 0 0 1 1316.56 891)">supposed to do?</text><text fill="#393939" font-family="Segoe UI Light,Segoe UI Light_MSFontService,sans-serif" font-weight="300" font-size="83" transform="matrix(1 0 0 1 1316.56 1660)">I’m lost</text><text fill="#393939" font-family="Segoe UI Light,Segoe UI Light_MSFontService,sans-serif" font-weight="300" font-size="83" transform="matrix(1 0 0 1 1563.49 1660)">—</text><text fill="#393939" font-family="Segoe UI Light,Segoe UI Light_MSFontService,sans-serif" font-weight="300" font-size="83" transform="matrix(1 0 0 1 1668.33 1660)">and </text><text fill="#393939" font-family="Segoe UI Light,Segoe UI Light_MSFontService,sans-serif" font-weight="300" font-size="83" transform="matrix(1 0 0 1 1316.56 1759)">slightly irritated</text></g></svg>