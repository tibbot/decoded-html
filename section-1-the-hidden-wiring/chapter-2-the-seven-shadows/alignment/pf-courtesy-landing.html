<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PF-Courtesy-landing</title>

  <link rel="stylesheet" href="file:///C:/Users/guy_b/OneDrive/Documents/re-BComm/Decoded/CSS/svg.css">


</head>
<body>
  <div class="pf">

  <div class="pf-wrapper" data-pf-name="PF-Courtesy-landing">
    <div class="pf-band">
        <div class="pf-band-label">
            <h4>Purpose</h4>
        </div>
        <div class="pf-band-copy">
            <p>Acknowledge and sustain connection.</p>
        </div>
    </div>
    <div class="pf-example-grid">
        <div class="pf-example-label">
            <h4>Version A</h4>
        </div>
        <div class="pf-example-label">
            <h4>Version B</h4>
        </div>
    </div>
    <div class="pf-example-grid pf-example-grid--separated">
        <div class="pf-example">
            <p>Looks good.</p>
        </div>
        <div class="pf-example">
            <p>Looks good. </p>
            <p>I appreciate the turnaround.</p>
        </div>
    </div>
    <div class="pf-band">
        <div class="pf-band-label">
            <h4>Return to<br>Purpose</h4>
        </div>
        <div class="pf-band-copy">
            <p>Both messages intend to acknowledge. One closes. The other keeps the exchange open.</p>
        </div>
    </div>
</div>

  </div>
</body>
